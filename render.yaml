# Render Blueprint — Groundwork Design Studio
# Deploy: connect this repo, or 'New Web Service' -> 'From render.yaml'
services:
  - type: web
    name: groundwork-design-studio
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Since MASTER_KEY encrypts every project/photo, it must never change.
      # Set once in Render and keep this value unchanged.
      - key: MASTER_KEY
        sync: false
      - key: GROUNDWORK_DATA_DIR
        value: /var/data
      - key: PORT
        value: 10000
      # Payments default to DEMO mode (no credentials needed, fake checkout).
      # Set PAYMENTS_MODE=live and add keys to go live:
      #   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET
      #   PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET  (PAYPAL_MODE=live for prod)
      - key: PAYMENTS_MODE
        value: demo
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
