name: Operations encrypted backup
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.OPS_BACKUP_ENABLED == 'true' && github.event.repository.private == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install reviewed PostgreSQL major-version client
        run: |
          bash scripts/install-postgres-client.sh
      - name: Export private schema directly to authenticated ciphertext
        run: node scripts/backup-export.mjs
        env:
          BACKUP_EXPORT_ACK: read-only-groundwork-export
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ALLOWED_HOST: ${{ vars.BACKUP_ALLOWED_HOST }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/groundwork-encrypted-backup
      - name: Authenticate the complete archive before offsite upload
        run: |
          node --input-type=module <<'NODE'
          import { readdir } from 'node:fs/promises';
          import { join } from 'node:path';
          import { verifyBackup } from './scripts/backup-verify.mjs';
          const directory = join(process.env.RUNNER_TEMP, 'groundwork-encrypted-backup');
          const archives = (await readdir(directory)).filter(name => name.endsWith('.gwb') && !name.endsWith('.manifest.gwb'));
          if (archives.length !== 1) throw new Error('Expected exactly one encrypted archive');
          console.log(JSON.stringify(await verifyBackup(join(directory, archives[0]))));
          NODE
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Retain encrypted offsite archive and encrypted manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: groundwork-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/groundwork-encrypted-backup/*.gwb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove runner ciphertext after upload
        if: always()
        run: node --input-type=module -e 'import {rm} from "node:fs/promises"; import {join} from "node:path"; await rm(join(process.env.RUNNER_TEMP,"groundwork-encrypted-backup"),{recursive:true,force:true});'
