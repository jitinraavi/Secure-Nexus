name: Operations health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: operations-health
  cancel-in-progress: false
jobs:
  health:
    # Opt in only after canonical origin and the owner's authorized inbox are configured.
    if: vars.OPS_MONITOR_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check external health and send authorized SMTP alert on failure
        run: node scripts/operational-health.mjs
        env:
          OPS_HEALTH_ORIGIN: ${{ vars.OPS_HEALTH_ORIGIN }}
          OPS_HEALTH_ALLOWED_ORIGINS: ${{ vars.OPS_HEALTH_ALLOWED_ORIGINS }}
          OPS_SEND_ALERTS: '1'
          OPS_ALERT_TO: ${{ vars.OPS_ALERT_TO }}
          MAIL_HOST: ${{ secrets.OPS_MAIL_HOST }}
          MAIL_PORT: ${{ vars.OPS_MAIL_PORT }}
          MAIL_FROM: ${{ secrets.OPS_MAIL_FROM }}
          MAIL_USER: ${{ secrets.OPS_MAIL_USER }}
          MAIL_PASS: ${{ secrets.OPS_MAIL_PASS }}
          OPS_BACKUP_ENABLED: ${{ vars.OPS_BACKUP_ENABLED }}
          OPS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
