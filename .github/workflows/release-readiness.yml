name: Release readiness
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character production-branch commit that passed CI
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  readiness:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify exact commit and record release evidence
        run: node scripts/release-readiness.mjs >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
