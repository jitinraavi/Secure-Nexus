services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Public use requires a separate HTTPS reverse proxy.
      - "${GROUNDWORK_PUBLISH_HOST:-127.0.0.1}:${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      BIND_HOST: 0.0.0.0
      GROUNDWORK_SERVER_ROLE: authority
      GROUNDWORK_AUTHORITY_GATEWAY_MODE: direct
      GROUNDWORK_DATA_DIR: /data
      DATABASE_PROVIDER: supabase
      DATABASE_URL: ${DATABASE_URL:?Configure the dedicated Supabase runtime connection}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      MASTER_KEY: ${MASTER_KEY:?Provision a stable base64 32-byte MASTER_KEY}
      PREVIOUS_MASTER_KEY: ${PREVIOUS_MASTER_KEY:-}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?Set the public HTTPS application origin}
      GROUNDWORK_TRUSTED_PROXY_IPS: ${GROUNDWORK_TRUSTED_PROXY_IPS:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:?Configure smtp or resend before onboarding users}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?Set a verified sender address}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PAYMENTS_MODE: live
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_ACCOUNT_ID: ${RAZORPAY_ACCOUNT_ID:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MERCHANT_ID: ${PAYPAL_MERCHANT_ID:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-live}
      ORGANIZATION_SEAT_PRICE_INR_MINOR: ${ORGANIZATION_SEAT_PRICE_INR_MINOR:-}
      ORGANIZATION_SEAT_TERM_DAYS: ${ORGANIZATION_SEAT_TERM_DAYS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      IMAGEN_API_KEY: ${IMAGEN_API_KEY:-}
      IMAGEN_MODEL: ${IMAGEN_MODEL:-}
      RENDER_JOB_MAX_ACTIVE: ${RENDER_JOB_MAX_ACTIVE:-2}
      NATIVE_WORKER_ENABLED: "false"
      NATIVE_ISOLATION_ACKNOWLEDGED: "false"
    volumes:
      - groundwork_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Excluded from normal compose up/build. This scaffold exits with an
  # explanation; a reviewed dedicated native worker is not supplied here.
  worker:
    profiles: [native-worker-unverified]
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: "no"
    network_mode: none

volumes:
  groundwork_data:
    name: groundwork_data
